
type User {
  id: ID!
  username: String!
  email: String!
  
  # movie: RC
  movies: [Movie]
  favoriteMovies: [Movie]
  moviesByMultipleGenres(genres: [String!]!): [Movie]
  
  # book: RC
  books: [Book]
  favoriteBooks: [Book]
  booksByMultipleGenres(genres: [String!]!): [Book]
}


type Director {
  id: ID!
  name: String!
  country: String
  birthYear: Int
  movies: [Movie]  # Chain: Dir -> Mov
  movieCount: Int
  created_at: String!
}


type Author {
  id: ID!
  name: String!
  country: String
  birthYear: Int
  books: [Book]   # Chain: Auth -> Book
  bookCount: Int
  created_at: String!
}


type Movie {
  id: ID!
  title: String!
  genre: [String!]!
  rating: Int
  review: String
  status: String!
  is_favorite: Boolean!
  year: Int
  runtime: Int
  directors: [Director]  # Chain: Mov -> Dir
  created_at: String!
}


type Book {
  id: ID!
  title: String!
  genre: [String!]!
  rating: Int
  review: String
  status: String!
  is_favorite: Boolean!
  year: Int
  pages: Int
  authors: [Author]  # Chain: Book -> Auth
  created_at: String!
}


type AuthPayload {
  token: String!
  user: User!
}


type Query {
  me: User
  getUser(id: ID!): User
  
  # Dir-Auth queries
  getAllDirectors: [Director]
  getDirector(id: ID!): Director
  getAllAuthors: [Author]
  getAuthor(id: ID!): Author
}


type Mutation {
  signup(username: String!, email: String!, password: String!): AuthPayload
  login(email: String!, password: String!): AuthPayload
  
  addMovie(title: String!, genre: [String!]!, rating: Int, 
            review: String, status: String!, year: Int, runtime: Int,
            directorNames: [String!]): Movie
  
  updateMovie(id: ID!, genre: [String!], rating: Int, 
              review: String, status: String, is_favorite: Boolean,
              year: Int, runtime: Int): Movie
  
  deleteMovie(id: ID!): Boolean
  
  addBook(title: String!, genre: [String!]!, rating: Int, 
          review: String, status: String!, year: Int,
          pages: Int, authorNames: [String!]): Book
  
  updateBook(id: ID!, genre: [String!], rating: Int, 
              review: String, status: String, is_favorite: Boolean,
              year: Int, pages: Int): Book
  
  deleteBook(id: ID!): Boolean

  addDirector(name: String!, country: String, birthYear: Int): Director
  updateDirector(id: ID!, name: String, country: String, birthYear: Int): Director
  deleteDirector(id: ID!): Boolean
  addAuthor(name: String!, country: String, birthYear: Int): Author
  updateAuthor(id: ID!, name: String, country: String, birthYear: Int): Author
  deleteAuthor(id: ID!): Boolean
}
