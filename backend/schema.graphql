
"""
Making changes to whole struct to use the multiple resolvers for same stuffs like movies and books,
"""


type User {
  id: ID!
  username: String!
  email: String!
  
  # movie: RC
  movies: [Movie]
  favoriteMovies: [Movie]
  moviesByStatus(status: String!): [Movie]
  moviesByGenre(genre: String!): [Movie]
  moviesByMultipleGenres(genres: [String!]!): [Movie]
  moviesByDirector(directorName: String!): [Movie]
  moviesByYear(year: Int!): [Movie]
  
  # book: RC
  books: [Book]
  favoriteBooks: [Book]
  booksByStatus(status: String!): [Book]
  booksByGenre(genre: String!): [Book]
  booksByMultipleGenres(genres: [String!]!): [Book]
  booksByAuthor(authorName: String!): [Book]
  booksByYear(year: Int!): [Book]
  
  # Filters
  favoriteMoviesByGenre(genre: String!): [Movie]
  favoriteMoviesByDirector(directorName: String!): [Movie]
  favoriteBooksByGenre(genre: String!): [Book]
  favoriteBooksByAuthor(authorName: String!): [Book]
}


type Director {
  id: ID!
  name: String!
  country: String
  birthYear: Int
  movies: [Movie]  # Chain: Dir -> Mov
  movieCount: Int
  created_at: String!
}


type Author {
  id: ID!
  name: String!
  country: String
  birthYear: Int
  books: [Book]   # Chain: Auth -> Book
  bookCount: Int
  created_at: String!
}


type Movie {
  id: ID!
  title: String!
  genre: [String!]!
  rating: Int
  review: String
  status: String!
  is_favorite: Boolean!
  year: Int
  runtime: Int
  directors: [Director]  # Chain: Mov -> Dir
  created_at: String!
}


type Book {
  id: ID!
  title: String!
  genre: [String!]!
  rating: Int
  review: String
  status: String!
  is_favorite: Boolean!
  year: Int
  pages: Int
  authors: [Author]  # Chain: Book -> Auth
  created_at: String!
}


type AuthPayload {
  token: String!
  user: User!
}


type Query {
  me: User
  getUser(id: ID!): User
  
  # Movie queries
  getMyMovies: [Movie]
  getFavoriteMovies: [Movie]
  getMoviesByStatus(status: String!): [Movie]
  getMoviesByGenre(genre: String!): [Movie]
  getMoviesByMultipleGenres(genres: [String!]!): [Movie]
  getMoviesByDirector(directorName: String!): [Movie]
  getMoviesByYear(year: Int!): [Movie]
  searchMovies(term: String!): [Movie]
  
  # Book queries
  getMyBooks: [Book]
  getFavoriteBooks: [Book]
  getBooksByStatus(status: String!): [Book]
  getBooksByGenre(genre: String!): [Book]
  getBooksByMultipleGenres(genres: [String!]!): [Book]
  getBooksByAuthor(authorName: String!): [Book]
  getBooksByYear(year: Int!): [Book]
  searchBooks(term: String!): [Book]
  
  # Dir-Auth queries
  getAllDirectors: [Director]
  getDirector(id: ID!): Director
  getDirectorByName(name: String!): Director
  getAllAuthors: [Author]
  getAuthor(id: ID!): Author
  getAuthorByName(name: String!): Author
}


type Mutation {
  signup(username: String!, email: String!, password: String!): AuthPayload
  login(email: String!, password: String!): AuthPayload
  
  addMovie(title: String!, genre: [String!]!, rating: Int, 
            review: String, status: String!, year: Int, runtime: Int,
            directorNames: [String!]): Movie
  
  updateMovie(id: ID!, genre: [String!], rating: Int, 
              review: String, status: String, is_favorite: Boolean,
              year: Int, runtime: Int): Movie
  
  deleteMovie(id: ID!): Boolean
  addMovieDirectors(movieId: ID!, directorNames: [String!]!): Movie
  
  addBook(title: String!, genre: [String!]!, rating: Int, 
          review: String, status: String!, year: Int,
          pages: Int, authorNames: [String!]): Book
  
  updateBook(id: ID!, genre: [String!], rating: Int, 
              review: String, status: String, is_favorite: Boolean,
              year: Int, pages: Int): Book
  
  deleteBook(id: ID!): Boolean
  addBookAuthors(bookId: ID!, authorNames: [String!]!): Book
  
  addDirector(name: String!, country: String, birthYear: Int): Director
  updateDirector(id: ID!, name: String, country: String, birthYear: Int): Director
  deleteDirector(id: ID!): Boolean
  addAuthor(name: String!, country: String, birthYear: Int): Author
  updateAuthor(id: ID!, name: String, country: String, birthYear: Int): Author
  deleteAuthor(id: ID!): Boolean
}
